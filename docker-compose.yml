version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: smalltask_db
    environment:
      POSTGRES_DB: smalltask
      POSTGRES_USER: kebyu
      POSTGRES_PASSWORD: 7007
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kebyu -d smalltask"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smalltask_redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: smalltask_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672" 

  api:
    build: .
    container_name: smalltask_api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    environment:
      - PORT=3000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=smalltask
      - DB_USER=kebyu
      - DB_PASSWORD=7007
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://rabbitmq
      - REDIS_TTL=3600
    ports:
      - "3000:3000"
    command: sh -c "npm run migrate && npm run start:dev" 

  worker:
    build: .
    container_name: smalltask_worker
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=smalltask
      - DB_USER=kebyu
      - DB_PASSWORD=7007
      - RABBITMQ_URL=amqp://rabbitmq
    command: npm run start:worker

volumes:
  pgdata:
