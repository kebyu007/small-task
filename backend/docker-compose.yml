services:
  db:
    image: postgres:15-alpine
    container_name: smalltask_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smalltask_redis
    ports:
      - "6380:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: smalltask_rabbitmq
    ports:
      - "5673:5672"
      - "15673:15672"

  api:
    build: .
    container_name: smalltask_api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    env_file: .env
    environment:
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://rabbitmq
    volumes:
      - ./src:/app/src
    ports:
      - "3000:3000"
    command: sh -c "npm run migrate && npm run start:dev" 

  worker:
    build: .
    container_name: smalltask_worker
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    env_file: .env
    environment:
      - DB_HOST=db
      - RABBITMQ_URL=amqp://rabbitmq
    volumes:
      - ./src:/app/src
    command: npm run start:worker

volumes:
  pgdata:
